# Issue #1: No-Pruning Control (dense baseline) — 30-cell grid.
# Sparsity is fixed at 0% for this method; the grid is just `[0.0]` so the
# orchestrator schema parity with #2–#5 holds.

method: no-pruning
sparsity_grid: [0.0]

# Per-arch dataset list (sum: 14 + 8 + 8 = 30 cells).
cells:
  gcn:
    - cora
    - citeseer
    - pubmed
    - cs
    - physics
    - photo
    - computers
    - reddit
    - cornell
    - texas
    - wisconsin
    - actor
    - bbbp
    - proteins
  gat:
    - cora
    - citeseer
    - pubmed
    - computers
    - photo
    # reddit/gat removed: full-batch attention eval OOMs (~178 GiB); infeasible.
    - cornell
    - actor
  graphsage:
    - flickr
    - ogbn-arxiv
    - reddit
    - yelp
    - ogbn-products
    # yelpchi dropped (issue #7): PyG 2.7 ships no YelpChi loader — option 4.
    - bbbp
    - proteins
  # Heterophily-capable backbone (GPR-GNN) on the heterophilic datasets, so the
  # pruning comparison runs on a base model that actually learns these graphs
  # (vanilla GCN/GAT barely clear trivial baselines). Run with
  # `--architectures gprgnn` to do only this slice.
  gprgnn:
    - cornell
    - texas
    - wisconsin
    - actor

default_metric: accuracy
metric_overrides:
  # Heterophilic single-label NC → macro-F1 (issue #1).
  cornell: macro_f1
  texas: macro_f1
  wisconsin: macro_f1
  actor: macro_f1
  # Multi-label NC → micro-F1 (issue #1; matches BCE training loss).
  yelp: micro_f1
  ogbn-proteins: micro_f1

# Multi-seed core cells for error bars (issue #8). Large NC datasets are forced
# single-seed in code (_resolve_seeds) since their minibatch training is run once.
seeds: [0, 1, 2]

# Issue #9: WebKB / Actor ship 10 Geom-GCN split columns — run & average all.
splits:
  cornell: all
  texas: all
  wisconsin: all
  actor: all

default_hyperparams:
  hidden_dim: 256
  lr: 0.01
  weight_decay: 5.0e-4
  epochs: 200
  patience: 50

hyperparam_overrides:
  # Graph-classification: smaller LR, fewer epochs, mini-batches.
  bbbp:
    lr: 1.0e-3
    weight_decay: 0.0
    epochs: 100
    patience: 20
    batch_size: 32
  proteins:
    lr: 1.0e-3
    weight_decay: 0.0
    epochs: 100
    patience: 20
    batch_size: 32
  # Heterophilic small graphs — shorter run is fine.
  cornell:
    epochs: 200
    patience: 50
  texas:
    epochs: 200
    patience: 50
  wisconsin:
    epochs: 200
    patience: 50
  actor:
    epochs: 200
    patience: 50
  # Large NC datasets: minibatch (NeighborLoader) training — full-batch is
  # 1 gradient step/epoch, which undertrains these. Minibatch gives many steps
  # per epoch, so epoch counts are small. Eval + Wanda activation collection
  # stay full-batch on the sparse path (run on CUDA / Colab A100).
  ogbn-arxiv:
    mini_batch: true
    fanout: [15, 10]
    batch_size: 1024
    epochs: 40
    patience: 10
  reddit:
    mini_batch: true
    fanout: [15, 10]
    batch_size: 1024
    epochs: 40
    patience: 10
  yelp:
    mini_batch: true
    fanout: [15, 10]
    batch_size: 1024
    epochs: 40
    patience: 10
  ogbn-products:
    mini_batch: true
    fanout: [10, 5]        # smaller fanout to bound subgraph size on 2.4M nodes
    batch_size: 1024
    epochs: 30
    patience: 10
  flickr:
    mini_batch: true
    fanout: [15, 10]
    batch_size: 1024
    epochs: 40
    patience: 10
